[workspace]
resolver = "2"
members = ["crates/core", "crates/vim", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
intent-core = { path = "crates/core" }
intent-vim = { path = "crates/vim" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
gpui = "0.2.2"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 2
