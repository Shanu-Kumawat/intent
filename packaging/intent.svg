<?xml version="1.0" encoding="UTF-8"?>
<!--
  Intent logo — the Commitment Mark.

  Two square brackets framing a solid square: intent as a frame, the
  commitment as the thing held inside it. The mark is pure geometry on a
  128-grid — sharp corners, uniform 18-unit stroke, no font dependency —
  so it survives every size from a 16px favicon to a poster. Drawn to be
  the whole identity: app icon, header glyph, and README mark all use the
  same three shapes.

  Grid: 128 viewBox. Frame margin 20, stroke 18, brackets' arms reach to
  x=50/78, the 24-unit square sits centered (52..76) with a 2-unit gap to
  each arm — the commitment never touches the frame; intent holds it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- left bracket: bar + top/bottom arms reaching toward the center -->
  <path d="M 20 20 H 50 V 38 H 38 V 90 H 50 V 108 H 20 Z" fill="#000000"/>
  <!-- right bracket: mirror of the left -->
  <path d="M 108 20 H 78 V 38 H 90 V 90 H 78 V 108 H 108 Z" fill="#000000"/>
  <!-- the commitment: a solid square, held but never touched -->
  <rect x="52" y="52" width="24" height="24" fill="#000000"/>
</svg>
